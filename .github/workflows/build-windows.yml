name: Build PokeGypt Windows x64

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build on Windows 2022 (MSVC x64)
    runs-on: windows-2022

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Scripts do vcpkg fixados no commit 2200159 (2026-10-02, "Refresh MSYS2 packages"):
      # links msys2 validos e contem o port gmp 6.3.0#5 (autoconf corrigido).
      # As VERSOES dos pacotes vem do builtin-baseline + overrides em vcpkg.json (Boost 1.86.0).
      # fetch-depth 0: o vcpkg le o commit do baseline no historico git.
      - name: Checkout vcpkg (2026-10-02)
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 2200159cd465157f20133e363e4604ac4d68181b
          path: vcpkg
          fetch-depth: 0

      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      # Cache binario do vcpkg: cada pacote e indexado pelo hash ABI (versao + triplet + compilador),
      # entao um cache antigo nunca mistura versoes diferentes; no pior caso, so recompila.
      - name: Set up vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-bincache
          key: vcpkg-bin-${{ runner.os }}-x64-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-bin-${{ runner.os }}-x64-

      # Dependencias vem do vcpkg.json (modo manifest) e sao instaladas durante o configure;
      # qualquer falha de instalacao derruba este passo.
      - name: Configure CMake
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-bincache
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake -B build -S . `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows
          if ($LASTEXITCODE -ne 0) { throw "CMake configure / vcpkg install falhou" }

      # So roda se algo falhar: mostra o erro real de cada pacote do vcpkg no fim do log.
      - name: Show vcpkg failure logs
        if: failure()
        shell: pwsh
        run: |
          $log = "build\vcpkg-manifest-install.log"
          if (Test-Path $log) {
            Write-Host "===== $log (linhas com erro) ====="
            Select-String -Path $log -Pattern "error|failed" | Select-Object -Last 40 | ForEach-Object { $_.Line }
          }
          Get-ChildItem vcpkg\buildtrees -Recurse -Include "*-err.log","config.log" -ErrorAction SilentlyContinue |
            Where-Object { $_.Length -gt 0 } | ForEach-Object {
              Write-Host "===== $($_.FullName) ====="
              Get-Content $_.FullName -Tail 60
            }

      - name: Verify Boost 1.86 legacy Asio API
        shell: pwsh
        run: |
          $inc = "build\vcpkg_installed\x64-windows\include\boost"
          $num = (Select-String -Path "$inc\version.hpp" -Pattern '#define BOOST_VERSION (\d+)').Matches[0].Groups[1].Value
          Write-Host "BOOST_VERSION = $num"
          if ($num -ne "108600") { throw "Esperado Boost 1.86.0 (108600), encontrado $num" }
          foreach ($h in "asio\io_service.hpp", "asio\deadline_timer.hpp", "date_time\posix_time\posix_time_types.hpp") {
            if (-not (Test-Path "$inc\$h")) { throw "Header ausente: boost\$h" }
          }

      - name: Build PokeGypt (Release x64)
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Package Executable and DLLs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package

          # Copia o executavel tfs.exe
          $exePath = Get-ChildItem -Path build -Recurse -Filter "tfs.exe" | Select-Object -First 1 -ExpandProperty FullName
          if ($exePath) {
            Write-Host "Encontrado executavel em: $exePath"
            Copy-Item -Path $exePath -Destination "package\tfs.exe"
          } else {
            throw "Erro: tfs.exe nao encontrado no diretorio de build!"
          }

          # Copia as DLLs de runtime instaladas pelo vcpkg (modo manifest)
          $buildVcpkgBin = "build\vcpkg_installed\x64-windows\bin"
          if (-not (Test-Path $buildVcpkgBin)) { throw "Erro: $buildVcpkgBin nao encontrado!" }
          Write-Host "Copiando DLLs de: $buildVcpkgBin"
          Get-ChildItem -Path $buildVcpkgBin -Filter "*.dll" | Copy-Item -Destination "package\"

          # Cria o arquivo de instrucoes
          @"
          ==================================================
          PokeGypt Server - Executavel Windows x64
          Compativel com Intel Core i3-530 (Base x64 / SSE2)
          ==================================================
          Instrucoes de instalacao:
          1. Copie o arquivo 'tfs.exe' e todas as DLLs (.dll) desta pasta.
          2. Cole diretamente na raiz do servidor PokeGypt (ao lado de 'config.lua' e da pasta 'data/').
          3. Abra o 'tfs.exe'.
          4. O banco de dados SQLite ('pokegypt.sqlite') sera inicializado automaticamente no primeiro boot.
          ==================================================
          "@ | Out-File -FilePath "package\LEIA-ME.txt" -Encoding utf8

      - name: Upload Windows x64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokeGypt-Windows-x64
          path: package/*
          if-no-files-found: error
